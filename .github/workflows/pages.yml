name: Publicar portafolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar los archivos del sitio
        run: |
          mkdir public
          cp index.html Style.css Script.js public/
          cp -R img public/
      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
